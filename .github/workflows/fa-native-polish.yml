name: Persian final native QA
on:
  push:
    branches: [fa-native-polish-20261009]
    paths:
      - .github/workflows/fa-native-polish.yml
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa-native-polish-20261009
      - name: Verify all Persian pages and integration
        shell: bash
        run: |
          python -m py_compile _fa_publish_qa.py
          python -u _fa_publish_qa.py
