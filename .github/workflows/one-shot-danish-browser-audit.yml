name: One-shot Danish browser navigation QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-danish-browser-audit.yml'
permissions:
  contents: write
jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test actual Chromium navigation at mobile and desktop widths
        shell: bash
        run: |
          CHROME_EXE="$(command -v google-chrome || command -v chromium || command -v chromium-browser || command -v google-chrome-stable || true)"
          if [ -z "$CHROME_EXE" ]; then echo "No Chrome binary preinstalled"; exit 1; fi
          npm install --prefix /tmp/danish-playwright --no-audit --no-fund --silent playwright-core
          cat > /tmp/danish-browser-audit.js <<'JS'
          const fs=require('fs');
          const {chromium}=require('/tmp/danish-playwright/node_modules/playwright-core');
          const BASE='https://agurkin2021-gif.github.io/vps-for-n8n/';
          const SLUGS=['','best-vps-for-n8n.html','about.html','n8n-backup-and-restore.html','contact.html','install-n8n-on-a-vps.html','n8n-cloud-vs-self-hosted.html','n8n-vps-requirements.html','privacy.html','secure-n8n-on-a-vps.html','n8n-queue-mode.html'];
          (async()=>{
           let chrome=process.env.CHROME_EXE;
           let report={tool:'Chromium via Playwright Core on GitHub-hosted runner',chrome,checks:[],transitionChecks:[],responsive:[],failures:[],result:'UNKNOWN'};
           let browser;
           try {
            browser=await chromium.launch({executablePath:chrome,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            for(const width of [390,1280]){
             const context=await browser.newContext({viewport:{width,height:830}});
             const page=await context.newPage();
             page.setDefaultTimeout(12000);
             for(const slug of SLUGS){
               const u=BASE+'da/'+slug;
               try{
                 const response=await page.goto(u,{waitUntil:'domcontentloaded',timeout:30000});
                 const footer=page.locator('footer .footer-lang-switch');
                 const btn=footer.locator('button');
                 const da=footer.locator('.lang-menu a').filter({hasText:'Dansk'});
                 await btn.click();
                 const menuVisible=await footer.locator('.lang-menu').isVisible();
                 const danishVisible=await da.isVisible();
                 const href=await da.getAttribute('href');
                 const h1=await page.locator('h1').count();
                 const horizontalOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+3);
                 await btn.click();
                 const closed=!(await footer.locator('.lang-menu').isVisible());
                 const good=response?.status()===200&&menuVisible&&danishVisible&&href===u&&h1===1&&closed;
                 report.checks.push({width,path:'da/'+slug,status:response?.status(),h1,menuVisible,danishVisible,selfHref:href,closes:closed,horizontalOverflow,pass:good});
                 if(!good)report.failures.push({width,url:u,reason:'page menu or HTTP test'});
               }catch(err){report.checks.push({width,path:'da/'+slug,pass:false,error:String(err)});report.failures.push({width,url:u,error:String(err)});}
             }
             for(const [from,expected] of [['sv/about.html','da/about.html'],['ru/o-proekte.html','da/about.html'],['bg/best-vps-for-n8n.html','da/best-vps-for-n8n.html'],['fi/n8n-queue-mode.html','da/n8n-queue-mode.html'],['','da/']]){
              try{
                await page.goto(BASE+from,{waitUntil:'domcontentloaded',timeout:30000});
                const footer=page.locator('footer .footer-lang-switch');
                await footer.locator('button').click();
                await footer.locator('.lang-menu a').filter({hasText:'Dansk'}).click();
                await page.waitForURL(BASE+expected,{timeout:20000});
                const footerBack=page.locator('footer .footer-lang-switch');
                await footerBack.locator('button').click();
                const stillVisible=await footerBack.locator('.lang-menu a').filter({hasText:'Dansk'}).isVisible();
                const homeRemains=await footerBack.locator('.lang-menu a').filter({hasText:'English'}).count()===1;
                const good=stillVisible&&homeRemains;
                report.transitionChecks.push({width,from,to:expected,danishPreserved:stillVisible,englishPreserved:homeRemains,pass:good});
                if(!good)report.failures.push({width,from,reason:'missing language after transition'});
              }catch(err){report.transitionChecks.push({width,from,to:expected,pass:false,error:String(err)});report.failures.push({width,from,error:String(err)});}
             }
             await context.close();
            }
           }catch(err){report.failures.push({kind:'browser_start',error:String(err)});}
           finally{if(browser)await browser.close();}
           report.result=report.failures.length===0?'PASS':'FAIL';
           fs.writeFileSync('.github/danish_browser_audit.json',JSON.stringify(report,null,2)+'\n');
           console.log(JSON.stringify({result:report.result,checks:report.checks.length,transitions:report.transitionChecks.length,failures:report.failures,overflow:report.checks.filter(x=>x.horizontalOverflow).map(x=>({w:x.width,p:x.path}))},null,2));
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          CHROME_EXE="$CHROME_EXE" node /tmp/danish-browser-audit.js
          rm -f .github/workflows/one-shot-danish-browser-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || (git commit -m 'Verify Danish mobile and desktop footer language switching in Chromium' && git push origin HEAD:main)
