name: One-shot Danish site integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-danish-navigation.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update site pages and sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          from html import unescape
          
          BASE = "https://agurkin2021-gif.github.io/vps-for-n8n/"
          SITEMAP = Path("sitemap.xml")
          TRANSLATIONS = {
              "": "da/",
              "best-vps-for-n8n.html": "da/best-vps-for-n8n.html",
              "about.html": "da/about.html",
              "n8n-backup-and-restore.html": "da/n8n-backup-and-restore.html",
              "contact.html": "da/contact.html",
              "install-n8n-on-a-vps.html": "da/install-n8n-on-a-vps.html",
              "n8n-cloud-vs-self-hosted.html": "da/n8n-cloud-vs-self-hosted.html",
              "n8n-vps-requirements.html": "da/n8n-vps-requirements.html",
              "privacy.html": "da/privacy.html",
              "secure-n8n-on-a-vps.html": "da/secure-n8n-on-a-vps.html",
              "n8n-queue-mode.html": "da/n8n-queue-mode.html",
          }
          source = SITEMAP.read_text(encoding="utf-8")
          paths = [unescape(x) for x in re.findall(r"<loc>([^<]+)</loc>", source)]
          assert len(paths) == len(set(paths)), "Duplicate URLs in source sitemap"
          english_paths = [p for p in paths if p.startswith(BASE) and "/" not in p[len(BASE):]]
          assert set(p[len(BASE):] for p in english_paths) == set(TRANSLATIONS), "English sitemap changed"
          assert len(english_paths) == len(TRANSLATIONS) == 11
          for target in TRANSLATIONS.values():
              rel = target + "index.html" if target.endswith("/") else target
              assert Path(rel).is_file(), f"Danish page absent: {rel}"
          
          MENU_RE = re.compile(r'<div class="lang-menu"[^>]*>[\s\S]*?</div>')
          EN_ANCHOR = re.compile(r'<a\b[^>]*href="([^"]+)"[^>]*>\s*English\s*</a>', re.I)
          FI_ANCHOR = re.compile(r'(<a\b[^>]*>\s*Suomi\s*</a>)', re.I)
          DA_ANCHOR = re.compile(r'<a\b[^>]*href="([^"]*/da/[^"]*)"[^>]*>\s*Dansk\s*</a>', re.I)
          footer_re = re.compile(r'(<footer\b[^>]*>[\s\S]*?)(</footer>)',re.I)
          changed = 0
          menus_added = 0
          head_tags_added = 0
          footer_switches_added = 0
          not_found = []
          unmapped = []
          pages_to_update = list(dict.fromkeys(paths + [BASE + x for x in TRANSLATIONS.values()]))
          for full_url in pages_to_update:
              if not full_url.startswith(BASE):
                  continue
              relative_url = full_url[len(BASE):]
              filepath = "index.html" if relative_url == "" else relative_url + "index.html" if relative_url.endswith("/") else relative_url
              file = Path(filepath)
              if not file.is_file():
                  not_found.append(filepath)
                  continue
              old = file.read_text(encoding="utf-8")
              menus = MENU_RE.findall(old)
              if not menus:
                  unmapped.append(filepath + " (no language menu)")
                  continue
              english_matches = [m.group(1) for menu in menus if (m := EN_ANCHOR.search(menu))]
              english_url = english_matches[0] if english_matches else ""
              english_key = english_url[len(BASE):] if english_url.startswith(BASE) else None
              if "/" not in filepath:
                  english_key = "" if filepath == "index.html" else filepath
              elif filepath.startswith("da/"):
                  english_key = "" if filepath == "da/index.html" else filepath[3:]
              if english_key == "index.html":
                  english_key = ""
              is_home = filepath == "index.html" or filepath.endswith("/index.html")
              equivalent = english_key in TRANSLATIONS and (english_key != "" or is_home)
              da_relative = TRANSLATIONS[english_key] if equivalent else "da/"
              if not equivalent:
                  unmapped.append(filepath + " (Danish homepage fallback)")
              danish_href = BASE + da_relative
              is_danish_page = filepath.startswith("da/")
              danish_anchor = '<a href="' + danish_href + '" hreflang="da" lang="da"' + (' aria-current="page"' if is_danish_page else '') + '>Dansk</a>'
          
              def add_to_menu(match):
                  global menus_added
                  menu = match.group(0)
                  if DA_ANCHOR.search(menu):
                      return menu
                  menus_added += 1
                  if FI_ANCHOR.search(menu):
                      return FI_ANCHOR.sub(lambda mm: mm.group(1) + danish_anchor, menu, count=1)
                  return menu[:-6] + danish_anchor + "</div>"
          
              new = MENU_RE.sub(add_to_menu, old)
              if not 'footer-lang-switch' in new and '<footer' in new:
                  header_menu = MENU_RE.search(new)
                  header_btn = re.search(r'<div class="lang-switch">\s*<button[^>]*>([\s\S]*?)</button>',new)
                  if header_menu:
                      button_text = header_btn.group(1) if header_btn else "Language &#9662;"
                      inner = re.sub(r'^<div class="lang-menu"[^>]*>|</div>$', '', header_menu.group(0))
                      switch = '<div class="lang-switch footer-lang-switch"><button type="button">' + button_text + '</button><div class="lang-menu" style="top:auto;bottom:100%">' + inner + '</div></div>'
                      new = footer_re.sub(lambda m: m.group(1) + switch + m.group(2), new, count=1)
                      footer_switches_added += 1
          
              head = new.split("</head>",1)[0]
              if equivalent and not re.search(r'<link\b[^>]*hreflang="da"', head):
                  new = new.replace('</head>', '<link rel="alternate" hreflang="da" href="' + danish_href + '"/></head>', 1)
                  head_tags_added += 1
              if new != old:
                  file.write_text(new, encoding="utf-8")
                  changed += 1
          
          # Add each Danish canonical location exactly once.
          for da_relative in TRANSLATIONS.values():
              uri = BASE + da_relative
              if "<loc>" + uri + "</loc>" not in source:
                  source = source.replace("</urlset>", "  <url><loc>" + uri + "</loc></url>\n</urlset>")
          SITEMAP.write_text(source, encoding="utf-8")
          assert len(re.findall(r"<loc>([^<]+)</loc>",source)) == len(set(re.findall(r"<loc>([^<]+)</loc>",source))), "Sitemap duplicate"
          assert all(source.count("<loc>" + BASE + uri + "</loc>") == 1 for uri in TRANSLATIONS.values())
          assert len([x for x in re.findall(r"<loc>([^<]+)</loc>",source) if x.startswith(BASE + "da/")]) == 11
          
          # All Danish pages must have correct self-navigation in header and footer.
          for target in TRANSLATIONS.values():
              file = Path(target+"index.html" if target.endswith("/") else target)
              h = file.read_text(encoding="utf-8")
              assert h.count(">Dansk</a>") >= 2, str(file)
              assert "footer-lang-switch" in h, str(file)
              assert 'hreflang="da"' in h, str(file)
          print(f"SUCCESS changed={changed}; menus_added={menus_added}; hreflang_added={head_tags_added}; footer_switches_added={footer_switches_added}; sitemap_urls=416; missing_files={len(not_found)}")
          if not_found:
              print("SITEMAP_FILES_MISSING:",not_found)
          if unmapped:
              print("DANISH_HOMEPAGE_FALLBACK_AND_NO_MENU:",unmapped)
          
          PY
          rm -f da/.queue-translation-part1.txt da/.queue-translation-part2.txt .github/workflows/one-shot-danish-navigation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || (git commit -m 'Integrate Danish navigation across site, sitemap and hreflang' && git push origin HEAD:main)
