name: Ephemeral n8n backup recovery QA
on:
  push:
    paths:
      - '.github/workflows/n8n-backup-restore-ephemeral-qa.yml'
jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Run isolated n8n 2.x and PostgreSQL 18 recovery test
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/n8n-isolated-qa
          cd /tmp/n8n-isolated-qa
          cat > compose.yaml <<'COMPOSE'
          services:
            postgres:
              image: postgres:18
              environment:
                POSTGRES_USER: qa
                POSTGRES_PASSWORD: isolated_test_only
                POSTGRES_DB: qa
                PGDATA: /var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U qa -d qa"]
                interval: 4s
                timeout: 4s
                retries: 30
              volumes:
                - qa-postgres:/var/lib/postgresql/data
            n8n:
              image: docker.n8n.io/n8nio/n8n:2.42.5
              environment:
                DB_TYPE: postgresdb
                DB_POSTGRESDB_HOST: postgres
                DB_POSTGRESDB_PORT: "5432"
                DB_POSTGRESDB_DATABASE: qa
                DB_POSTGRESDB_USER: qa
                DB_POSTGRESDB_PASSWORD: isolated_test_only
                N8N_ENCRYPTION_KEY: QA0123456789abcdefgh0123456789abcdefgh
                N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
                N8N_DIAGNOSTICS_ENABLED: "false"
                N8N_TEMPLATES_ENABLED: "false"
                N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
              ports:
                - "127.0.0.1:15678:5678"
              volumes:
                - qa-n8n:/home/node/.n8n
              depends_on:
                postgres:
                  condition: service_healthy
          volumes:
            qa-postgres:
            qa-n8n:
          COMPOSE
          trap 'echo "::group::Ephemeral cleanup"; docker compose logs --tail=45 || true; docker compose down -v || true; echo "::endgroup::"' EXIT
          echo 'QA: Starting isolated Postgres 18 + n8n 2.42.5 (no external VPS)'
          docker compose up -d
          ready=0
          for i in $(seq 1 72); do
            if curl -fsS http://127.0.0.1:15678/healthz >/dev/null 2>&1; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then echo "QA_FAIL: n8n /healthz not ready"; exit 1; fi
          echo 'QA_PASS: n8n app started and database migrations completed'
          # A real record inside n8n's actual database proves the DB restore, without touching user data.
          docker compose exec -T postgres psql -U qa -d qa -v ON_ERROR_STOP=1 -c "CREATE TABLE qa_restore_evidence(value TEXT NOT NULL); INSERT INTO qa_restore_evidence VALUES ('n8n-db-restore-pass-20261008');"
          echo 'QA: Exporting n8n workflows and credentials via supported CLI'
          docker compose exec -T n8n n8n export:workflow --backup --output=/home/node/.n8n/backups/workflows/
          docker compose exec -T n8n n8n export:credentials --backup --output=/home/node/.n8n/backups/credentials/
          echo 'QA_PASS: workflow/credential CLI exports'
          docker compose cp n8n:/home/node/.n8n/backups ./cli-backups
          test -d ./cli-backups/workflows
          test -d ./cli-backups/credentials
          echo 'QA_PASS: Docker Compose service-to-host backup directory transport'
          docker compose exec -T postgres pg_dump -U qa -d qa -Fc > n8n-postgres.dump
          test -s n8n-postgres.dump
          docker compose exec -T postgres pg_restore --list < n8n-postgres.dump >/dev/null
          echo 'QA_PASS: PostgreSQL pg_dump -Fc and pg_restore --list'
          docker compose stop n8n
          docker compose cp n8n:/home/node/.n8n ./n8n-user-folder-backup
          test -e ./n8n-user-folder-backup/config
          echo 'QA_PASS: application volume backup copied from stopped n8n'
          # The only deleted volumes are the two belonging to this disposable CI project.
          docker compose down -v
          docker compose up -d postgres
          docker compose exec -T postgres pg_restore --exit-on-error --no-owner --no-acl -U qa -d qa < n8n-postgres.dump
          value=$(docker compose exec -T postgres psql -U qa -d qa -tAc "SELECT value FROM qa_restore_evidence LIMIT 1;" | tr -d '\r')
          if [ "$value" != 'n8n-db-restore-pass-20261008' ]; then echo "QA_FAIL: restored database record missing: $value"; exit 1; fi
          echo 'QA_PASS: real PostgreSQL custom-format dump restored on empty new database'
          docker compose up -d n8n
          docker compose stop n8n
          docker compose cp ./n8n-user-folder-backup/. n8n:/home/node/.n8n/
          docker compose start n8n
          ready=0
          for i in $(seq 1 72); do
            if curl -fsS http://127.0.0.1:15678/healthz >/dev/null 2>&1; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then echo 'QA_FAIL: recovered n8n did not start'; exit 1; fi
          echo 'QA_PASS: recovered n8n + persistent folder starts and health check passes'
          docker compose exec -T n8n mkdir -p /home/node/.n8n/backups
          docker compose cp ./cli-backups/. n8n:/home/node/.n8n/backups/
          docker compose exec -T n8n test -d /home/node/.n8n/backups/workflows
          docker compose exec -T n8n test -d /home/node/.n8n/backups/credentials
          echo 'QA_PASS: reverse Docker Compose host-to-service directory copy'
          echo 'QA_SUMMARY: Isolated n8n/PG backup and recovery smoke test passed; no production data used'
