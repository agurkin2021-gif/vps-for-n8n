name: Dutch sequential HTML localization and publication QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/nl-localization.yml
permissions:
  contents: write
jobs:
  translate-pages-sequentially:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Confirm authoritative English sitemap
        shell: bash
        run: |
          python -m py_compile _nl_translate_full.py _nl_publish_qa.py
          python - <<'PY'
          from _nl_translate_full import verify_source_sitemap,PAGES
          assert verify_source_sitemap()==len(PAGES)==11
          print("DUTCH_SOURCE_QA ENGLISH_PAGES=11")
          PY
      - name: PAGE N translate verify save before PAGE N+1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -u - <<'PY'
          import subprocess
          from _nl_translate_full import PAGES,ROOT,process,validate,verify_source_sitemap
          assert verify_source_sitemap()==len(PAGES)==11
          for idx,(en,target) in enumerate(PAGES):
              print(f"DUTCH_PAGE_{idx+1}/11 OPEN {en}",flush=True)
              process(en,target)
              validate((ROOT/en).read_text(encoding="utf-8"),(ROOT/target).read_text(encoding="utf-8"),en,target)
              subprocess.run(["git","add",target,".github/nl-translation-cache.json"],check=True)
              subprocess.run(["git","commit","-m",f"Translate verify and save Dutch PAGE {idx+1}/11"],check=True)
              subprocess.run(["git","push","origin","HEAD:main"],check=True)
              print(f"DUTCH_PAGE_{idx+1}/11 VERIFIED_SAVED {target}",flush=True)
          PY
      - name: Integrate Dutch last in every language selector and validate sitemap
        shell: bash
        run: |
          python -u _nl_publish_qa.py
          git diff --binary > /tmp/nl-first-qa.diff
          python -u _nl_publish_qa.py
          git diff --binary > /tmp/nl-second-qa.diff
          cmp /tmp/nl-first-qa.diff /tmp/nl-second-qa.diff
          git add -u
          git add sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Add Dutch last to every language selector; hreflang and sitemap QA"
            git push origin HEAD:main
          fi
      - name: Save verified Dutch fragments after interruption
        if: failure()
        shell: bash
        run: |
          if [ -f .github/nl-translation-cache.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/nl-translation-cache.json
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint verified Dutch strings after interrupted page"
              git push origin HEAD:main
            fi
          fi
