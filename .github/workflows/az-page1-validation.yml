name: Verify Azerbaijani page 10 then save
on:
  push:
    branches: [main]
    paths: [.github/workflows/az-page1-validation.yml]
permissions:
  contents: write
jobs:
  page-ten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Translate, verify and save page 10
        shell: bash
        run: |
          python -u _az_translate_full.py 9
          python - <<'PY'
          from _az_translate_full import ROOT,validate,PAGES
          s,d=PAGES[9]
          validate((ROOT/s).read_text(encoding="utf-8"),(ROOT/d).read_text(encoding="utf-8"),s,d)
          print("AZ_PAGE_10_TRANSLATION_VERIFIED",flush=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add az/secure-n8n-on-a-vps.html
          git commit -m "Translate and verify Azerbaijani page 10 of 11"
          git push origin HEAD:main
