name: Final Azerbaijani sitewide footer and sitemap publication
on:
  push:
    branches: [main]
    paths: [.github/workflows/az-page1-validation.yml]
permissions:
  contents: write
jobs:
  page-three:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify 11 translated pages and integrate all language selectors
        shell: bash
        run: |
          python -u _az_publish_qa.py
          git diff --binary > /tmp/az_first.diff
          python -u _az_publish_qa.py
          git diff --binary > /tmp/az_second.diff
          cmp /tmp/az_first.diff /tmp/az_second.diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Add Azerbaijani to every header/footer language selector and sitemap"
            git push origin HEAD:main
          fi
