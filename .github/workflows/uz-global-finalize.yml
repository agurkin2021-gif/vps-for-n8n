name: Uzbek global finalize

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[uz-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Uzbek to all core-page language selectors and sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          BASE = "https://agurkin2021-gif.github.io/vps-for-n8n/"
          MAP = {
              "": "uz/",
              "best-vps-for-n8n.html": "uz/n8n-uchun-eng-yaxshi-vps.html",
              "about.html": "uz/loyiha-haqida.html",
              "n8n-backup-and-restore.html": "uz/n8n-zaxira-nusxa-va-tiklash.html",
              "contact.html": "uz/aloqa.html",
              "install-n8n-on-a-vps.html": "uz/n8n-vps-ornatish.html",
              "n8n-cloud-vs-self-hosted.html": "uz/n8n-cloud-vs-self-hosted.html",
              "n8n-vps-requirements.html": "uz/n8n-vps-talablari.html",
              "privacy.html": "uz/maxfiylik.html",
              "secure-n8n-on-a-vps.html": "uz/n8n-vps-xavfsizligi.html",
              "n8n-queue-mode.html": "uz/n8n-queue-mode.html",
          }

          UZ_LOCAL_LINKS = {
              "best-vps-for-n8n.html": "n8n-uchun-eng-yaxshi-vps.html",
              "about.html": "loyiha-haqida.html",
              "n8n-backup-and-restore.html": "n8n-zaxira-nusxa-va-tiklash.html",
              "contact.html": "aloqa.html",
              "install-n8n-on-a-vps.html": "n8n-vps-ornatish.html",
              "n8n-vps-requirements.html": "n8n-vps-talablari.html",
              "privacy.html": "maxfiylik.html",
              "secure-n8n-on-a-vps.html": "n8n-vps-xavfsizligi.html",
          }

          def href_from_tag(tag):
              m = re.search(r'href=["\']([^"\']+)["\']', tag, re.I)
              return m.group(1) if m else None

          def core_intent(html, path):
              for tag_type in ("a", "link"):
                  for m in re.finditer(rf'<{tag_type}\b[^>]*>', html, re.I):
                      tag = m.group(0)
                      if not re.search(r'hreflang=["\']en["\']', tag, re.I):
                          continue
                      href = href_from_tag(tag)
                      if not href or not href.startswith(BASE):
                          continue
                      rel = href[len(BASE):].split("#",1)[0].split("?",1)[0]
                      if rel == "index.html":
                          rel = ""
                      if rel in MAP:
                          return rel

              # Fallback for legacy/extra pages whose English hreflang is incomplete.
              name = path.name
              if name in MAP:
                  return name
              if path.as_posix() == "pt-br/n8n-hospedagem-brasil.html":
                  return ""
              return None

          menu_re = re.compile(r'<div class="lang-menu"([^>]*)>([\s\S]*?)</div>', re.I)
          uz_anchor_re = re.compile(r'<a\b[^>]*hreflang=["\']uz["\'][^>]*>[\s\S]*?</a>', re.I)
          uz_alt_re = re.compile(r'<link\b[^>]*hreflang=["\']uz["\'][^>]*?/?>', re.I)

          # Normalize internal links across all Uzbek pages now that all 11 exist.
          for p in Path("uz").glob("*.html"):
              html = p.read_text(encoding="utf-8")
              out = html
              for src, dst in UZ_LOCAL_LINKS.items():
                  out = re.sub(rf'href=(["\']){re.escape(src)}\1', lambda m, d=dst: f'href={m.group(1)}{d}{m.group(1)}', out)
              if out != html:
                  p.write_text(out, encoding="utf-8")

          changed = 0
          matched = 0
          menu_files = 0
          failures = []

          for p in Path(".").rglob("*.html"):
              if ".git" in p.parts:
                  continue
              html = p.read_text(encoding="utf-8")
              has_menu = 'class="lang-menu"' in html
              if has_menu:
                  menu_files += 1
              intent = core_intent(html, p)
              if intent is None:
                  if has_menu:
                      failures.append(f"Cannot determine English core intent: {p}")
                  continue

              matched += 1
              target = BASE + MAP[intent]
              out = html

              # Ensure one Uzbek alternate link in head, with the intent-matched target.
              out = uz_alt_re.sub("", out)
              out = re.sub(r'</head>', f'<link rel="alternate" hreflang="uz" href="{target}"/></head>', out, count=1, flags=re.I)

              is_uz = p.parts and p.parts[0] == "uz"

              def normalize_menu(match):
                  attrs, inner = match.group(1), match.group(2)
                  existing = uz_anchor_re.search(inner)
                  current = ' aria-current="page"' if is_uz else ""
                  anchor = f'<a href="{target}" hreflang="uz" lang="uz"{current}>O‘zbekcha</a>'
                  if existing:
                      # Keep the existing chronological language position.
                      inner = uz_anchor_re.sub(anchor, inner, count=1)
                      return f'<div class="lang-menu"{attrs}>{inner}</div>'
                  return f'<div class="lang-menu"{attrs}>{inner}{anchor}</div>'

              out = menu_re.sub(normalize_menu, out)

              if out != html:
                  p.write_text(out, encoding="utf-8")
                  changed += 1

          if failures:
              raise SystemExit("\n".join(failures))
          if matched != menu_files:
              raise SystemExit(f"Matched {matched} core HTML pages but found {menu_files} files with language menus")

          sitemap = Path("sitemap.xml")
          sm = sitemap.read_text(encoding="utf-8")
          for rel in MAP.values():
              u = BASE + rel
              if f"<loc>{u}</loc>" not in sm:
                  sm = re.sub(r'</urlset>\s*$', f'  <url><loc>{u}</loc></url>\n</urlset>', sm, count=1, flags=re.I)
          sitemap.write_text(sm, encoding="utf-8")

          uz_pages = sorted(Path("uz").glob("*.html"))
          if len(uz_pages) != 11:
              raise SystemExit(f"Expected 11 Uzbek HTML pages, found {len(uz_pages)}: {[p.name for p in uz_pages]}")

          forbidden_local = [
              'href="best-vps-for-n8n.html"',
              'href="about.html"',
              'href="n8n-backup-and-restore.html"',
              'href="contact.html"',
              'href="install-n8n-on-a-vps.html"',
              'href="n8n-vps-requirements.html"',
              'href="privacy.html"',
              'href="secure-n8n-on-a-vps.html"',
          ]

          for p in uz_pages:
              txt = p.read_text(encoding="utf-8")
              if not re.search(r'<html\b[^>]*lang=["\']uz["\']', txt, re.I):
                  raise SystemExit(f"Missing lang=uz: {p}")
              can = re.search(r'<link\b[^>]*rel=["\']canonical["\'][^>]*>', txt, re.I)
              if not can or "/uz/" not in can.group(0):
                  raise SystemExit(f"Bad Uzbek canonical: {p}")
              if txt.count('hreflang="uz" lang="uz" aria-current="page"') != 2:
                  raise SystemExit(f"Uzbek current-language menu mismatch: {p}")
              if txt.count('class="lang-menu"') != 2:
                  raise SystemExit(f"Expected two language menus: {p}")
              for bad in forbidden_local:
                  if bad in txt:
                      raise SystemExit(f"Unlocalized internal link {bad} in {p}")

          # Validate every language menu on every core page contains exactly one Uzbek entry.
          for p in Path(".").rglob("*.html"):
              if ".git" in p.parts:
                  continue
              txt = p.read_text(encoding="utf-8")
              if 'class="lang-menu"' not in txt:
                  continue
              menus = list(menu_re.finditer(txt))
              if not menus:
                  raise SystemExit(f"Language-menu marker found but no menu parsed: {p}")
              for menu in menus:
                  if len(uz_anchor_re.findall(menu.group(2))) != 1:
                      raise SystemExit(f"Uzbek menu entry count mismatch: {p}")

          for rel in MAP.values():
              u = BASE + rel
              if sm.count(f"<loc>{u}</loc>") != 1:
                  raise SystemExit(f"Sitemap Uzbek URL count mismatch for {u}")

          print(f"Core HTML pages matched: {matched}")
          print(f"HTML files changed: {changed}")
          print("Uzbek pages:", ", ".join(p.name for p in uz_pages))
          PY

      - name: Commit finalized Uzbek integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Uzbek finalization changes needed."
          else
            git commit -m "Finalize Uzbek localization [uz-finalize]"
            git push origin HEAD:main
          fi
