name: One-shot Danish counterpart correction
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-danish-correspondence.yml'
permissions:
  contents: write
jobs:
  verify-and-correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct multilingual page counterparts
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          
          BASE = "https://agurkin2021-gif.github.io/vps-for-n8n/"
          M = {
              "": "da/",
              "best-vps-for-n8n.html": "da/best-vps-for-n8n.html",
              "about.html": "da/about.html",
              "n8n-backup-and-restore.html": "da/n8n-backup-and-restore.html",
              "contact.html": "da/contact.html",
              "install-n8n-on-a-vps.html": "da/install-n8n-on-a-vps.html",
              "n8n-cloud-vs-self-hosted.html": "da/n8n-cloud-vs-self-hosted.html",
              "n8n-vps-requirements.html": "da/n8n-vps-requirements.html",
              "privacy.html": "da/privacy.html",
              "secure-n8n-on-a-vps.html": "da/secure-n8n-on-a-vps.html",
              "n8n-queue-mode.html": "da/n8n-queue-mode.html"
          }
          raw_sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          urls = re.findall(r"<loc>([^<]+)</loc>", raw_sitemap)
          assert len(urls) == 416 and len(set(urls)) == 416
          menu_re = re.compile(r'<div class="lang-menu"[^>]*>[\s\S]*?</div>')
          en_re = re.compile(r'<a\b[^>]*href="([^"]+)"[^>]*>\s*English\s*</a>', re.I)
          da_re = re.compile(r'(<a\b[^>]*href=")([^"]+)("[^>]*>\s*Dansk\s*</a>)',re.I)
          fi_re = re.compile(r'(<a\b[^>]*>\s*Suomi\s*</a>)',re.I)
          head_da_re = re.compile(r'<link\b[^>]*hreflang="da"[^>]*>',re.I)
          edits = 0
          corrected_links = 0
          added_head = 0
          fixed_head = 0
          fallback_pages = []
          no_menus = []
          
          for url in urls:
              if not url.startswith(BASE):
                  continue
              rel = url[len(BASE):]
              path = "index.html" if rel == "" else rel+"index.html" if rel.endswith("/") else rel
              f = Path(path)
              if not f.is_file():
                  continue
              old = f.read_text(encoding="utf-8")
              menus = menu_re.findall(old)
              if not menus:
                  no_menus.append(path)
                  continue
              candidates = []
              for menu in menus:
                  match = en_re.search(menu)
                  if match and match.group(1).startswith(BASE):
                      en_key = match.group(1)[len(BASE):]
                      if en_key == "index.html":
                          en_key = ""
                      if en_key in M:
                          candidates.append(en_key)
              if "/" not in path:
                  key = "" if path == "index.html" else path
              elif path.startswith("da/"):
                  key = "" if path == "da/index.html" else path[3:]
              else:
                  key = candidates[-1] if candidates else None
              is_home = path == "index.html" or path.endswith("/index.html")
              exact = key in M and (key != "" or is_home)
              da_url = BASE + (M[key] if exact else "da/")
              if not exact:
                  fallback_pages.append(path)
              def fix_menu(m):
                  global corrected_links
                  segment = m.group(0)
                  if da_re.search(segment):
                      old_dest = da_re.search(segment).group(2)
                      if old_dest != da_url:
                          corrected_links += 1
                          return da_re.sub(lambda x: x.group(1)+da_url+x.group(3),segment,count=1)
                      return segment
                  anchor = '<a href="'+da_url+'" lang="da" hreflang="da">Dansk</a>'
                  if fi_re.search(segment):
                      return fi_re.sub(lambda x: x.group(1)+anchor,segment,count=1)
                  return segment[:-6]+anchor+'</div>'
              new = menu_re.sub(fix_menu,old)
              head,boundary,tail = new.partition("</head>")
              if exact and boundary:
                  present = head_da_re.findall(head)
                  tag = '<link rel="alternate" hreflang="da" href="'+da_url+'"/>'
                  if not present:
                      head += tag
                      added_head += 1
                  elif not any('href="'+da_url+'"' in t for t in present):
                      head = head_da_re.sub(tag,head,count=1)
                      fixed_head += 1
                  new = head+boundary+tail
              if new != old:
                  f.write_text(new,encoding="utf-8")
                  edits += 1
          
          # Check cross-locale page linking using the Russian and Bulgarian cases,
          # which have different header/footer English links on some pages.
          for path, expected in {
              "bg/index.html":"da/",
              "bg/best-vps-for-n8n.html":"da/best-vps-for-n8n.html",
              "bg/n8n-vps-requirements.html":"da/n8n-vps-requirements.html",
              "es/index.html":"da/",
              "ru/o-proekte.html":"da/about.html",
              "sv/about.html":"da/about.html",
              "da/index.html":"da/"
          }.items():
              s = Path(path).read_text(encoding="utf-8")
              assert all('href="'+BASE+expected+'"' in x for x in menu_re.findall(s)), path
              assert any('href="'+BASE+expected+'"' in x for x in head_da_re.findall(s.split("</head>")[0])), path
          assert all((Path("da/index.html") if t.endswith("/") else Path(t)).is_file() for t in M.values())
          print(f"SUCCESS corrected_menu_urls={corrected_links}, added_head_tags={added_head}, fixed_head_tags={fixed_head}, modified_files={edits}, pages_falling_back={len(fallback_pages)}, no_menus={no_menus}")
          
          PY
          rm -f .github/workflows/one-shot-danish-correspondence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || (git commit -m 'Correct Danish page-to-page language switching across locales' && git push origin HEAD:main)
