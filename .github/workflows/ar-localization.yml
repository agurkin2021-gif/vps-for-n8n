name: Arabic sequential HTML localization and publication QA
on:
  push:
    branches: [ar-complete-sitemap-20261009]
    paths:
      - .github/workflows/ar-localization.yml
permissions:
  contents: write
jobs:
  translate-pages-sequentially:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ar-complete-sitemap-20261009
      - name: Confirm authoritative English sitemap
        shell: bash
        run: |
          python -m py_compile _ar_translate_full.py _ar_publish_qa.py
          python - <<'PY'
          from _ar_translate_full import verify_source_sitemap,PAGES
          assert verify_source_sitemap()==len(PAGES)==11
          print("ARABIC_SOURCE_QA ENGLISH_PAGES=11")
          PY
      - name: PAGE N translate verify save before PAGE N+1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -u - <<'PY'
          import subprocess
          from _ar_translate_full import PAGES,ROOT,process,validate,verify_source_sitemap
          assert verify_source_sitemap()==len(PAGES)==11
          for idx,(en,ar) in enumerate(PAGES):
              print(f"ARABIC_PAGE_{idx+1}/11 OPEN {en}",flush=True)
              process(en,ar)
              validate((ROOT/en).read_text(encoding="utf-8"),(ROOT/ar).read_text(encoding="utf-8"),en,ar)
              subprocess.run(["git","add",ar,".github/ar-translation-cache.json"],check=True)
              subprocess.run(["git","commit","-m",f"Translate verify and save Arabic PAGE {idx+1}/11"],check=True)
              subprocess.run(["git","push","origin","HEAD:ar-complete-sitemap-20261009"],check=True)
              print(f"ARABIC_PAGE_{idx+1}/11 VERIFIED_SAVED {ar}",flush=True)
          PY
      - name: Integrate Arabic in every language selector and validate sitemap
        shell: bash
        run: |
          python -u _ar_publish_qa.py
          git diff --binary > /tmp/ar-first-qa.diff
          python -u _ar_publish_qa.py
          git diff --binary > /tmp/ar-second-qa.diff
          cmp /tmp/ar-first-qa.diff /tmp/ar-second-qa.diff
          git add -u
          git add sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Add Arabic to every language selector and reciprocal hreflang; sitemap QA"
            git push origin HEAD:ar-complete-sitemap-20261009
          fi
      - name: Save verified Arabic fragments after interruption
        if: failure()
        shell: bash
        run: |
          if [ -f .github/ar-translation-cache.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ar-translation-cache.json
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint verified Arabic strings after interrupted page"
              git push origin HEAD:ar-complete-sitemap-20261009
            fi
          fi
