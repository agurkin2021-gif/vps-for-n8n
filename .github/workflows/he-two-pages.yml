name: Hebrew translation — first two pages
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/he-two-pages.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hebrew-first-two-pages
  cancel-in-progress: false
jobs:
  translate-verify-save:
    runs-on: ubuntu-latest
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline translation engine
        run: pip install --quiet 'argostranslate>=1.9,<2'
      - name: Install English-to-Hebrew language pack
        shell: bash
        run: |
          python - <<'PY'
          import argostranslate.package as packages
          packages.update_package_index()
          models=[p for p in packages.get_available_packages() if p.from_code=='en' and p.to_code=='he']
          assert models, "English-Hebrew offline translation pack unavailable"
          packages.install_from_path(models[0].download())
          print("HE_OFFLINE_LANGUAGE_PACK_READY",flush=True)
          PY
      - name: Verify authoritative English sitemap and Hebrew script
        shell: bash
        run: |
          python -m py_compile _he_translate_full.py
          python - <<'PY'
          from _he_translate_full import verify_source_sitemap, PAGES, LOOKUP
          assert verify_source_sitemap()==len(PAGES)==11
          assert len(LOOKUP)==2
          print("HE_ENGLISH_SITEMAP_PASS_11",flush=True)
          PY
      - name: PAGE 1 - TRANSLATE - VERIFY - SAVE
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -u _he_translate_full.py 0
          git add he/index.html .github/he-translation-cache.json
          git commit -m "Hebrew page 1 of 11: translate verify and save homepage"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "HE_PAGE_1_VERIFIED_AND_PUBLISHED"
              break
            fi
            git fetch origin main
            git rebase -X ours origin/main
            if [ "$attempt" -eq 5 ]; then exit 1; fi
          done
      - name: PAGE 2 - TRANSLATE - VERIFY - SAVE
        shell: bash
        run: |
          python -u _he_translate_full.py 1
          git add he/best-vps-for-n8n.html .github/he-translation-cache.json
          git commit -m "Hebrew page 2 of 11: translate verify and save provider comparison"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "HE_PAGE_2_VERIFIED_AND_PUBLISHED"
              break
            fi
            git fetch origin main
            git rebase -X ours origin/main
            if [ "$attempt" -eq 5 ]; then exit 1; fi
          done
      - name: Include the two completed Hebrew URLs in sitemap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from _he_translate_full import ROOT, BASE, PAGES, verify_source_sitemap
          assert verify_source_sitemap()==11
          sitemap=ROOT/'sitemap.xml'
          s=sitemap.read_text(encoding='utf-8')
          existing={n.text for n in ET.fromstring(s).findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc')}
          for en,he in PAGES[:2]:
              url=BASE+('he/' if he=='he/index.html' else he)
              if url not in existing:
                  s=s.replace('</urlset>', '  <url><loc>'+url+'</loc></url>\n</urlset>',1)
                  existing.add(url)
          sitemap.write_text(s,encoding='utf-8')
          assert len([u for u in existing if u.startswith(BASE+'he/')])==2
          ET.parse(sitemap)
          print('HE_SITEMAP_PASS_2_OF_11')
          PY
          git add sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Include verified Hebrew pages 1 and 2 in sitemap"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then break; fi
              git fetch origin main
              git rebase -X ours origin/main
              if [ "$attempt" -eq 5 ]; then exit 1; fi
            done
          fi
      - name: Final parity and language selector QA
        shell: bash
        run: |
          python - <<'PY'
          from _he_translate_full import PAGES,ROOT,validate,BASE,verify_source_sitemap
          import re,xml.etree.ElementTree as ET
          assert verify_source_sitemap()==11
          assert len(list((ROOT/'he').glob('*.html')))==2
          urls={el.text for el in ET.parse(ROOT/'sitemap.xml').findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc')}
          for en,he in PAGES[:2]:
              original=(ROOT/en).read_text(encoding='utf-8')
              translated=(ROOT/he).read_text(encoding='utf-8')
              validate(original,translated,en,he)
              assert translated.count('hreflang="he"')>=3
              assert 'dir="rtl"' in translated
              assert BASE+('he/' if he=='he/index.html' else he) in urls
              print('HE_PAGE_QA_PASS',en,'->',he,flush=True)
          assert len([u for u in urls if u.startswith(BASE+'he/')])==2
          print('HE_FIRST_TWO_PAGES_FINAL_PASS')
          PY