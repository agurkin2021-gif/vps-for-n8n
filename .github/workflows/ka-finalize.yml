name: Finalize Georgian integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Georgian everywhere and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          BASE = "https://agurkin2021-gif.github.io/vps-for-n8n/"
          exact = {
              "": "ka/",
              "best-vps-for-n8n.html": "ka/best-vps-for-n8n.html",
              "about.html": "ka/about.html",
              "n8n-backup-and-restore.html": "ka/n8n-backup-and-restore.html",
              "contact.html": "ka/contact.html",
              "install-n8n-on-a-vps.html": "ka/install-n8n-on-a-vps.html",
              "n8n-cloud-vs-self-hosted.html": "ka/n8n-cloud-vs-self-hosted.html",
              "n8n-vps-requirements.html": "ka/n8n-vps-requirements.html",
              "privacy.html": "ka/privacy.html",
              "secure-n8n-on-a-vps.html": "ka/secure-n8n-on-a-vps.html",
              "n8n-queue-mode.html": "ka/n8n-queue-mode.html",
          }

          menu_re = re.compile(r'(<div\s+class="lang-menu"[^>]*>)(.*?)(</div>)', re.S)
          en_anchor_re = re.compile(r'<a\b(?=[^>]*\bhreflang="en")(?=[^>]*\blang="en")[^>]*>English</a>')
          href_re = re.compile(r'href="([^"]+)"')
          head_ka_re = re.compile(r'<link\b(?=[^>]*\brel="alternate")(?=[^>]*\bhreflang="ka")[^>]*?/?>')
          head_hr_re = re.compile(r'(<link\b(?=[^>]*\brel="alternate")(?=[^>]*\bhreflang="hr")[^>]*?/?>)')

          files_changed = 0
          menus_added = 0
          heads_added = 0
          pages_with_menu = 0

          for path in Path(".").rglob("*.html"):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              if 'class="lang-menu"' not in text:
                  continue
              pages_with_menu += 1

              m = en_anchor_re.search(text)
              ka_url = BASE + "ka/"
              exact_equivalent = False
              if m:
                  hm = href_re.search(m.group(0))
                  if hm:
                      en_url = hm.group(1)
                      if en_url.startswith(BASE):
                          rel = en_url[len(BASE):]
                          if rel in exact:
                              ka_url = BASE + exact[rel]
                              exact_equivalent = True

              before = text

              def add_ka_to_menu(mm):
                  global menus_added
                  body = mm.group(2)
                  if re.search(r'hreflang="ka"', body):
                      return mm.group(0)
                  menus_added += 1
                  anchor = f'<a href="{ka_url}" hreflang="ka" lang="ka">ქართული</a>'
                  return mm.group(1) + body + anchor + mm.group(3)

              text = menu_re.sub(add_ka_to_menu, text)

              if exact_equivalent and not head_ka_re.search(text):
                  link = f'<link rel="alternate" hreflang="ka" href="{ka_url}"/>'
                  if head_hr_re.search(text):
                      text = head_hr_re.sub(lambda mm: mm.group(1) + link, text, count=1)
                  else:
                      text = text.replace("</head>", link + "</head>", 1)
                  heads_added += 1

              if text != before:
                  path.write_text(text, encoding="utf-8")
                  files_changed += 1

          sitemap = Path("sitemap.xml")
          s = sitemap.read_text(encoding="utf-8")
          sitemap_added = 0
          ka_urls = [BASE + v for v in exact.values()]
          additions = []
          for url in ka_urls:
              if f"<loc>{url}</loc>" not in s:
                  additions.append(f"  <url><loc>{url}</loc></url>")
                  sitemap_added += 1
          if additions:
              s = s.replace("</urlset>", "\n" + "\n".join(additions) + "\n</urlset>")
              sitemap.write_text(s, encoding="utf-8")

          # Validation
          missing_menu = []
          missing_head = []
          for path in Path(".").rglob("*.html"):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              if 'class="lang-menu"' not in text:
                  continue
              for mm in menu_re.finditer(text):
                  if not re.search(r'hreflang="ka"', mm.group(2)):
                      missing_menu.append(str(path))
                      break

              m = en_anchor_re.search(text)
              if m:
                  hm = href_re.search(m.group(0))
                  if hm and hm.group(1).startswith(BASE):
                      rel = hm.group(1)[len(BASE):]
                      if rel in exact and not head_ka_re.search(text):
                          missing_head.append(str(path))

          ka_files = sorted(Path("ka").glob("*.html"))
          sitemap_text = sitemap.read_text(encoding="utf-8")
          missing_sitemap = [u for u in ka_urls if f"<loc>{u}</loc>" not in sitemap_text]

          print(f"pages_with_menu={pages_with_menu}")
          print(f"files_changed={files_changed}")
          print(f"menus_added={menus_added}")
          print(f"heads_added={heads_added}")
          print(f"sitemap_added={sitemap_added}")
          print(f"ka_html_files={len(ka_files)}")

          if len(ka_files) != 11:
              raise SystemExit(f"Expected 11 Georgian HTML files, found {len(ka_files)}")
          if missing_menu:
              raise SystemExit("Missing Georgian menu in: " + ", ".join(missing_menu[:20]))
          if missing_head:
              raise SystemExit("Missing Georgian hreflang in: " + ", ".join(missing_head[:20]))
          if missing_sitemap:
              raise SystemExit("Missing Georgian sitemap URLs: " + ", ".join(missing_sitemap))
          PY

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Georgian language integration"
          git push origin HEAD:main
