name: Marathi English-sitemap localization and final publication QA
on:
  push:
    branches: [mr-complete-sitemap-20261009]
    paths:
      - .github/workflows/mr-localization.yml
permissions:
  contents: write
jobs:
  translate-and-verify-one-page-at-a-time:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mr-complete-sitemap-20261009
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: indictrans2-eng-to-mar-deva-200m-20261009
      - name: Validate scripts and the authoritative English sitemap
        run: |
          python -m py_compile _mr_translate_full.py _mr_offline_runtime.py _mr_editorial.py _mr_publish_qa.py
          python - <<'PY'
          from _mr_translate_full import verify_source_sitemap, PAGES
          assert verify_source_sitemap() == len(PAGES) == 11
          print("SOURCE SITEMAP: 11 English originals, one-to-one mapping confirmed")
          PY
      - name: Install offline Marathi translation engine
        run: |
          python -m pip install -q 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'transformers==4.44.2' sentencepiece indictranstoolkit
      - name: PAGE N -> TRANSLATE -> VERIFY -> SAVE -> NEXT PAGE
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -u - <<'PY'
          import subprocess
          from _mr_translate_full import PAGES,ROOT,process,validate,verify_source_sitemap
          from _mr_editorial import polish
          assert verify_source_sitemap()==len(PAGES)==11
          for idx,(en,mr) in enumerate(PAGES):
              print(f"PAGE {idx+1}/{len(PAGES)} OPEN {en}",flush=True)
              if (ROOT/mr).exists():
                  try:
                      validate((ROOT/en).read_text(encoding="utf-8"),(ROOT/mr).read_text(encoding="utf-8"),en,mr)
                      if len((ROOT/mr).read_text(encoding="utf-8"))>=len((ROOT/en).read_text(encoding="utf-8"))*.75:
                          print(f"PAGE {idx+1}/{len(PAGES)} ALREADY VERIFIED, RESUME {mr}",flush=True)
                          continue
                  except (AssertionError,ValueError,FileNotFoundError):
                      pass
              process(en,mr)
              polish(idx)
              validate((ROOT/en).read_text(encoding="utf-8"),(ROOT/mr).read_text(encoding="utf-8"),en,mr)
              subprocess.run(["git","add",mr,".github/mr-translation-cache.json"],check=True)
              subprocess.run(["git","commit","-m",f"Translate verify and save Marathi page {idx+1} of {len(PAGES)}"],check=True)
              subprocess.run(["git","push","origin","HEAD:mr-complete-sitemap-20261009"],check=True)
              print(f"PAGE {idx+1}/{len(PAGES)} SAVED {mr}",flush=True)
          PY
      - name: Add Marathi to every footer and header selector, sitemap and SEO alternates
        shell: bash
        run: |
          python -u _mr_publish_qa.py
          git diff --binary > /tmp/mr-first-pass.diff
          python -u _mr_publish_qa.py
          git diff --binary > /tmp/mr-second-pass.diff
          cmp /tmp/mr-first-pass.diff /tmp/mr-second-pass.diff
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Publish Marathi reciprocal hreflang, footer selectors and complete sitemap"
            git push origin HEAD:mr-complete-sitemap-20261009
          fi
          git status --short
      - name: Save verified translation fragments on a partial failure
        if: failure()
        shell: bash
        run: |
          if [ -f .github/mr-translation-cache.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/mr-translation-cache.json
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint verified Marathi text segments"
              git push origin HEAD:mr-complete-sitemap-20261009
            fi
          fi
