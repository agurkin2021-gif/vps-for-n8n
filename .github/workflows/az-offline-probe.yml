name: Probe Qwen3 Azerbaijani terminology and idiomatic quality
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/az-offline-probe.yml
permissions:
  contents: read
jobs:
  mt-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install model dependencies
        shell: bash
        run: python -m pip install -q "transformers>=4.53,<5" sentencepiece "torch>=2.3"
      - name: Translate test segments with Apache licensed Qwen
        shell: bash
        env:
          HF_HUB_DISABLE_XET: "1"
        run: |
          python -u - <<'PY'
          import time,torch
          from transformers import AutoTokenizer,AutoModelForCausalLM
          torch.set_num_threads(3)
          name="Qwen/Qwen3-1.7B"
          start=time.monotonic()
          tokenizer=AutoTokenizer.from_pretrained(name)
          model=AutoModelForCausalLM.from_pretrained(name,torch_dtype=torch.float32,low_cpu_mem_usage=True).eval()
          print("MODEL_LOAD_SECONDS",round(time.monotonic()-start,1),flush=True)
          sample=[
            "Choose your VPS",
            "Compare VPS for n8n configurations from $0.07/day. Match CPU, RAM, storage and traffic to light automations, production workflows, data processing and AI.",
            "Back up the n8n database, data volume and encryption key before upgrading or moving the instance.",
            "Use the larger option for data-heavy work and substantial overlap; use the lighter option for a lean instance with small, mostly sequential jobs.",
            "When is 8 GB RAM a better choice than 4 GB?",
            "The configurations above map to the published Standard server specifications and rates. Verify rates at checkout."
          ]
          for source in sample:
            msg=[{"role":"system","content":"You are a specialist English-to-Azerbaijani web localization translator. Translate the following English text into idiomatic Azerbaijani Latin script. Preserve brands (n8n, VDSina, Docker), technical terms (VPS, CPU, RAM, API), every number, all currencies, measurement units, conditions and exact meaning. Output ONLY the final translation, no comments, no paraphrase and no omissions."},{"role":"user","content":source}]
            chat=tokenizer.apply_chat_template(msg,tokenize=False,add_generation_prompt=True,enable_thinking=False)
            inputs=tokenizer(chat,return_tensors="pt")
            with torch.inference_mode():
              out=model.generate(**inputs,max_new_tokens=175,do_sample=False,pad_token_id=tokenizer.eos_token_id)
            answer=tokenizer.decode(out[0][inputs["input_ids"].shape[-1]:],skip_special_tokens=True).strip()
            print("INPUT",source,"\nOUTPUT",answer,flush=True)
          print("TOTAL_SECONDS",round(time.monotonic()-start,1),flush=True)
          PY
