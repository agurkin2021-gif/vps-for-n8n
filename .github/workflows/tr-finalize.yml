name: Turkish native editorial finalization
on:
  push:
    branches: [tr-complete-sitemap-20261009]
    paths: [.github/workflows/tr-finalize.yml]
permissions:
  contents: write
jobs:
  polish-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tr-complete-sitemap-20261009
          fetch-depth: 0

      - name: Compile and validate finalization scripts
        run: |
          python -m py_compile _tr_translate_full.py _tr_native_polish.py _tr_publish_qa.py
          python - <<'PY'
          from _tr_translate_full import verify_source_sitemap,PAGES
          assert verify_source_sitemap()==len(PAGES)==11
          print("TURKISH_FINAL_SOURCE_PAGES=11")
          PY

      - name: Native Turkish editorial review, page by page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 0 10); do
            python -u _tr_native_polish.py "$i"
            git add tr/
            if ! git diff --cached --quiet; then
              git commit -m "Polish native Turkish page $((i+1))/11"
              git push origin HEAD:tr-complete-sitemap-20261009
            fi
          done

      - name: Rebuild Turkish site-wide selectors and sitemap
        run: |
          python -u _tr_publish_qa.py
          git diff --binary > /tmp/tr-native-first.diff
          python -u _tr_publish_qa.py
          git diff --binary > /tmp/tr-native-second.diff
          cmp /tmp/tr-native-first.diff /tmp/tr-native-second.diff

      - name: Final source-parity verification after editorial polish
        run: |
          python -u - <<'PY'
          from _tr_translate_full import PAGES,ROOT,validate
          for i,(en,tr) in enumerate(PAGES,1):
              validate((ROOT/en).read_text(encoding="utf-8"),(ROOT/tr).read_text(encoding="utf-8"),en,tr)
              print(f"TURKISH_NATIVE_FINAL_PASS {i}/11 {tr}")
          PY

      - name: Commit final Turkish integration
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize native Turkish localization and selectors"
            git push origin HEAD:tr-complete-sitemap-20261009
          fi
