name: Punjabi local-model translation probe
on:
  push:
    branches: [pa-complete-sitemap-20261009]
    paths: [.github/workflows/pa-offline-probe.yml]
jobs:
  language-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Cache M2M100 translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: en-pa-m2m100-418m-v1
      - name: Install model libraries
        run: |
          python -m pip install -q 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'transformers==4.44.2' sentencepiece
          python - <<'PY'
          import torch
          print("Torch available:",torch.__version__,"CPU threads:",torch.get_num_threads(),flush=True)
          PY
      - name: Run English to Punjabi batch translation test
        shell: bash
        run: |
          python -u - <<'PY'
          import time
          from transformers import AutoTokenizer, AutoModelForSeq2SeqLM
          import torch
          torch.set_num_threads(2)
          model_id="facebook/m2m100_418M"
          started=time.time()
          tok=AutoTokenizer.from_pretrained(model_id,src_lang="en")
          model=AutoModelForSeq2SeqLM.from_pretrained(model_id)
          model.eval()
          print("MODEL_LOADED_SECONDS",round(time.time()-started,2),flush=True)
          tests=[
            "Choose the resources your workflows need.",
            "Compare VPS configurations from $0.07/day. Keep Docker, PostgreSQL and n8n unchanged.",
            "If your database is hosted on the same server, keep encrypted backups of the key.",
            "§0§ The minimum includes §1§ RAM and §2§ storage.",
            "VDSina, n8n, Docker, PostgreSQL, Linux and Ubuntu.",
          ]
          inp=tok(tests,return_tensors="pt",padding=True,truncation=True,max_length=250)
          with torch.inference_mode():
            res=model.generate(**inp,forced_bos_token_id=tok.get_lang_id("pa"),max_new_tokens=250,num_beams=2)
          for e,t in zip(tests,tok.batch_decode(res,skip_special_tokens=True)):
            print("SOURCE:",e,flush=True)
            print("PUNJABI:",t,flush=True)
          print("TOTAL_SECONDS",round(time.time()-started,2),flush=True)
          PY
