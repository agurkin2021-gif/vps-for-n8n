name: Polish exact HTML localization
on:
  push:
    branches:
      - localization/pl-exact-source-20261008
    paths:
      - ".github/scripts/pl_exact_translate.py"
      - ".github/workflows/pl-exact.yml"
concurrency:
  group: pl-exact-source-translation
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install translator
        run: python -m pip install "deep-translator>=1.11,<2"
      - name: Translate and validate source-preserving Polish pages
        run: python .github/scripts/pl_exact_translate.py
      - name: Commit staged Polish localization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/ .github/pl_translate_cache.json .github/pl_exact_translation_qa.json
          git commit -m "Translate 8 Polish HTML pages preserving complete English DOM" || true
          git push
