name: Mobile footer dropdown geometry QA
on:
  push:
    branches: [qa-footer-mobile-geometry-20261009]
    paths: [.github/workflows/qa-footer-mobile-geometry.yml]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser binding
        run: python -m pip install -q playwright
      - name: Verify mobile language dropdown fully fits
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          BASE="https://agurkin2021-gif.github.io/vps-for-n8n/"
          pages=[
           "ja/","ja/about.html","ja/privacy.html","ja/best-vps-for-n8n.html",
           "ja/n8n-backup-restore.html","ja/install-n8n-vps-docker.html","ja/n8n-queue-mode.html",
           "de/bester-vps-fuer-n8n.html","es/mejor-vps-para-n8n.html","bn/about.html","ru/rezervnoe-kopirovanie-n8n.html"
          ]
          with sync_playwright() as p:
            browser=p.chromium.launch(channel="chrome",headless=True,args=["--no-sandbox"])
            tests=0
            for width in (320,390):
              context=browser.new_context(viewport={"width":width,"height":790},device_scale_factor=1)
              for path in pages:
                page=context.new_page()
                response=page.goto(BASE+path+"?qa_footer_position="+str(width),wait_until="domcontentloaded",timeout=30000)
                assert response and response.status==200,(path,"HTTP status",response.status if response else -1)
                footer=page.locator("footer .footer-lang-switch")
                assert footer.count()==1,(path,"Missing footer switcher")
                footer.locator("button").scroll_into_view_if_needed()
                footer.locator("button").click()
                menu=footer.locator(".lang-menu")
                assert menu.is_visible(),(path,"Footer menu hidden")
                box=menu.bounding_box()
                assert box and -1<=box["x"] and box["x"]+box["width"]<=width+1,(path,"Footer dropdown clipped",box,width)
                assert menu.locator("a",has_text="日本語").count()>0,(path,"Japanese link absent")
                over=page.evaluate("Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-window.innerWidth")
                assert over<=2,(path,"Page overflow",over,width)
                tests+=1
                print("PASS",width,path,"footer-menu x=",round(box["x"]),"width=",round(box["width"]),"page-overflow=",over,flush=True)
                page.close()
              context.close()
            browser.close()
          print("MOBILE_FOOTER_VISUAL_QA_PASS",tests,"checks at 320px and 390px",flush=True)
          PY
