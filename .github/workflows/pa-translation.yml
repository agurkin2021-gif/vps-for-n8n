name: Sequential Punjabi translation (offline, resumable)
on:
  push:
    branches: [pa-complete-sitemap-20261009]
    paths: [.github/workflows/pa-translation.yml]
permissions:
  contents: write
jobs:
  page-one:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pa-complete-sitemap-20261009
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: en-pa-indictrans2-200m-v1
      - name: Install offline translation engine
        run: |
          python -m pip install -q 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'transformers==4.44.2' sentencepiece indictranstoolkit
      - name: Translate and verify full English homepage
        shell: bash
        run: |
          python -m py_compile _pa_translate_full.py _pa_offline_runtime.py _pa_sync_nav.py
          python -u _pa_translate_full.py 0
      - name: Save validated page one
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pa/index.html .github/pa-translation-cache.json
          git commit -m "Translate verify save Punjabi page 1 of 11"
          git push origin HEAD:pa-complete-sitemap-20261009

      - name: Preserve verified translation cache on failure
        if: failure()
        shell: bash
        run: |
          if [ -f .github/pa-translation-cache.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/pa-translation-cache.json
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint verified Punjabi text slots after translation error"
              git push origin HEAD:pa-complete-sitemap-20261009
            fi
          fi
