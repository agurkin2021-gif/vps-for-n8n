name: Punjabi page 1 final verification
on:
  push:
    branches: [pa-complete-sitemap-20261009]
    paths: [.github/workflows/pa-translation.yml]
permissions:
  contents: write
jobs:
  page-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pa-complete-sitemap-20261009
      - name: Validate 259 Punjabi text slots and complete page 1
        run: |
          python -m py_compile _pa_translate_full.py _pa_sync_nav.py
          python -u _pa_translate_full.py 0
      - name: Commit only the validated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pa/index.html
          git commit -m "Translate verify save Punjabi page 1 of 11"
          git push origin HEAD:pa-complete-sitemap-20261009
