name: Romanian sequential HTML localization and publication QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ro-localization.yml
permissions:
  contents: write
jobs:
  translate-pages-sequentially:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Confirm authoritative English sitemap
        shell: bash
        run: |
          python -m py_compile _ro_translate_full.py _ro_native_polish.py _ro_publish_qa.py
          python - <<'PY'
          from _ro_translate_full import verify_source_sitemap,PAGES
          assert verify_source_sitemap()==len(PAGES)==11
          print("ROMANIAN_SOURCE_QA ENGLISH_PAGES=11")
          PY
      - name: PAGE N translate verify save before PAGE N+1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -u - <<'PY'
          import subprocess
          from _ro_translate_full import PAGES,ROOT,process,validate,verify_source_sitemap
          assert verify_source_sitemap()==len(PAGES)==11
          for idx,(en,target) in enumerate(PAGES[11:], start=11):
              print(f"ROMANIAN_PAGE_{idx+1}/11 OPEN {en}",flush=True)
              process(en,target)
              validate((ROOT/en).read_text(encoding="utf-8"),(ROOT/target).read_text(encoding="utf-8"),en,target)
              subprocess.run(["git","add",target,".github/ro-translation-cache.json"],check=True)
              subprocess.run(["git","commit","-m",f"Translate verify and save Romanian PAGE {idx+1}/11"],check=True)
              subprocess.run(["git","push","origin","HEAD:main"],check=True)
              print(f"ROMANIAN_PAGE_{idx+1}/11 VERIFIED_SAVED {target}",flush=True)
          PY
      - name: Native Romanian editorial polish and page QA
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -u - <<'PY'
          from _ro_translate_full import PAGES,ROOT,validate
          from _ro_native_polish import polish
          for idx,(en,target) in enumerate(PAGES):
              polish(idx)
              validate((ROOT/en).read_text(encoding="utf-8"),(ROOT/target).read_text(encoding="utf-8"),en,target)
              print(f"ROMANIAN_NATIVE_QA {idx+1}/11 {target} PASS",flush=True)
          PY
          git add ro/*.html
          if ! git diff --cached --quiet; then
            git commit -m "Polish Romanian translation quality on all 11 pages"
            git push origin HEAD:main
          fi
      - name: Integrate Romanian last in every language selector and validate sitemap
        shell: bash
        run: |
          python -u _ro_publish_qa.py
          git diff --binary > /tmp/ro-first-qa.diff
          python -u _ro_publish_qa.py
          git diff --binary > /tmp/ro-second-qa.diff
          cmp /tmp/ro-first-qa.diff /tmp/ro-second-qa.diff
          git add -u
          git add sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Add Romanian last to every language selector; hreflang and sitemap QA"
            git push origin HEAD:main
          fi
      - name: Save verified Romanian fragments after interruption
        if: failure()
        shell: bash
        run: |
          if [ -f .github/ro-translation-cache.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ro-translation-cache.json
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint verified Romanian strings after interrupted page"
              git push origin HEAD:main
            fi
          fi
