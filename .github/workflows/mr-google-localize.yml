name: Marathi source-faithful localization and publication
on:
  push:
    branches: [mr-google-complete-20261009]
    paths: [.github/workflows/mr-google-localize.yml]
permissions:
  contents: write
jobs:
  translate-pages-sequentially:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mr-google-complete-20261009
      - name: Verify the 11 authoritative English sitemap entries
        run: |
          python -m py_compile _mr_translate_full.py _mr_editorial.py _mr_publish_qa.py
          python - <<'PY'
          from _mr_translate_full import PAGES,verify_source_sitemap
          assert verify_source_sitemap()==len(PAGES)==11
          print("MARATHI_SOURCE_QA English original pages 11",flush=True)
          PY
      - name: PAGE 1 -> TRANSLATE -> VERIFY -> SAVE -> PAGE 2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -u - <<'PY'
          import subprocess
          from _mr_translate_full import PAGES,ROOT,process,validate,verify_source_sitemap
          from _mr_editorial import polish
          assert verify_source_sitemap()==len(PAGES)
          for idx,(en,mr) in enumerate(PAGES):
              print(f"MARATHI_START {idx+1}/{len(PAGES)} English={en}",flush=True)
              process(en,mr)
              polish(idx)
              validate((ROOT/en).read_text(encoding="utf-8"),(ROOT/mr).read_text(encoding="utf-8"),en,mr)
              subprocess.run(["git","add",mr,".github/mr-translation-cache.json"],check=True)
              subprocess.run(["git","commit","-m",f"Marathi translate-verify-save PAGE {idx+1} of {len(PAGES)}"],check=True)
              subprocess.run(["git","push","origin","HEAD:mr-google-complete-20261009"],check=True)
              print(f"MARATHI_SAVED {idx+1}/{len(PAGES)} {mr}",flush=True)
          PY
      - name: Finish reciprocal language menu links, footer on all languages and sitemap
        shell: bash
        run: |
          python -u _mr_publish_qa.py
          git diff --binary > /tmp/mr-first-pass.diff
          python -u _mr_publish_qa.py
          git diff --binary > /tmp/mr-second-pass.diff
          cmp /tmp/mr-first-pass.diff /tmp/mr-second-pass.diff
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Integrate Marathi site-wide switching, hreflang, sitemap; QA 0 issues"
            git push origin HEAD:mr-google-complete-20261009
          fi
      - name: Save verified partial translation cache on failures
        if: failure()
        shell: bash
        run: |
          if [ -f .github/mr-translation-cache.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/mr-translation-cache.json
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint source-faithful Marathi translation cache"
              git push origin HEAD:mr-google-complete-20261009
            fi
          fi
