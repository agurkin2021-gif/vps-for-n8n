name: Japanese page localization
on:
  push:
    branches: [ja-complete-20261009]
    paths: [.github/workflows/ja-translation.yml]
permissions:
  contents: write
jobs:
  translate-page-one:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ja-complete-20261009
      - name: Validate and translate English homepage
        shell: bash
        run: |
          python -m py_compile _ja_translate_full.py
          python -u _ja_translate_full.py 0
      - name: Save verified page one
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ja/index.html .github/ja-translation-cache.json
          git commit -m "Translate and verify Japanese page 1 of 11"
          git push origin HEAD:ja-complete-20261009
