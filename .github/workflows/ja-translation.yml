name: Japanese page localization
on:
  push:
    branches: [ja-complete-20261009]
    paths: [.github/workflows/ja-translation.yml]
permissions:
  contents: write
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify translation service connectivity
        shell: bash
        run: |
          python - <<'PY'
          import urllib.parse,urllib.request,json
          query=urllib.parse.urlencode({'client':'gtx','sl':'en','tl':'ja','dt':'t','q':'Back up the database and encryption key before upgrading.\n\nZZSEGMENTKEEPZZ\n\nSelf-hosted n8n requires you to manage security updates.'})
          url='https://translate.googleapis.com/translate_a/single?'+query
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=20) as res: data=json.load(res)
          print("TRANSLATION_PROBE:",''.join(p[0] for p in data[0]))
          PY
