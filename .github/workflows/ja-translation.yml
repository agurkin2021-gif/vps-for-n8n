name: Japanese localization final navigation audit
on:
  push:
    branches: [ja-complete-20261009]
    paths: [.github/workflows/ja-translation.yml]
permissions:
  contents: write
jobs:
  verify-and-sync-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ja-complete-20261009
      - name: Check all eleven full Japanese HTML pages
        shell: bash
        run: |
          python -m py_compile _ja_translate_full.py _ja_sync_nav.py
          python - <<'PY'
          from _ja_translate_full import PAGES, ROOT, validate
          for i, (en, ja) in enumerate(PAGES, 1):
              validate((ROOT/en).read_text(encoding="utf-8"), (ROOT/ja).read_text(encoding="utf-8"), en, ja)
              print(f"PAGE {i:02d}/11 PARITY PASS: {ja}")
          PY
      - name: Synchronize footer language choices and sitemap
        shell: bash
        run: |
          python -u _ja_sync_nav.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Publish-ready Japanese footer choices and complete sitemap"
            git push origin HEAD:ja-complete-20261009
          fi
