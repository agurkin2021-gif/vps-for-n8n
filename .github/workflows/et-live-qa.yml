name: Verify published Estonian pages
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/et-live-qa.yml"
      - "et/**"
      - "sitemap.xml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: estonian-live-qa
  cancel-in-progress: false
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify sitemap and published Estonian pages
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import time
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          base = "https://agurkin2021-gif.github.io/vps-for-n8n/"
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          sitemap = ET.parse("sitemap.xml").getroot()
          urls = [x.text for x in sitemap.findall("sm:url/sm:loc", ns) if x.text]
          assert len(urls) == len(set(urls)), "duplicate sitemap URLs"
          english = [u for u in urls if u.startswith(base) and "/" not in u[len(base):]]
          estonian = [u for u in urls if u.startswith(base + "et/")]
          assert len(english) == 11, ("english sitemap count", len(english))
          assert 2 <= len(estonian) <= 11, ("estonian sitemap count", len(estonian))

          for url in estonian:
              relative = url[len(base):]
              filename = "et/index.html" if relative == "et/" else relative
              assert Path(filename).is_file(), ("missing file", filename)

          def fetch(url):
              last_error = None
              for attempt in range(12):
                  try:
                      req = urllib.request.Request(
                        url,
                        headers={"User-Agent": "n8nVPS-Estonian-LiveQA/1.0",
                                 "Cache-Control": "no-cache"}
                      )
                      with urllib.request.urlopen(req, timeout=20) as response:
                          content = response.read().decode("utf-8")
                          assert response.status == 200, (url, response.status)
                          return content
                  except Exception as exc:
                      last_error = exc
                      time.sleep(5)
              raise AssertionError(f"{url} failed: {last_error}")

          menu_re = re.compile(r'<div\b[^>]*class="lang-menu"[^>]*>(.*?)</div>', re.I | re.S)
          for url in estonian:
              html = fetch(url)
              head = html.split("</head>", 1)[0]
              assert re.search(r'<html\b[^>]*lang="et"', html, re.I), url
              assert len(re.findall(r'<h1(?:\s|>)', html, re.I)) == 1, url
              assert 'hreflang="et"' in head and url in head, url
              assert 'rel="canonical"' in head, url
              menus = menu_re.findall(html)
              assert len(menus) == 2, (url, len(menus))
              for menu in menus:
                  options = re.findall(r'<a\b[^>]*>.*?</a>', menu, re.I | re.S)
                  assert options[-1].endswith(">Eesti</a>"), url
                  assert f'href="{url}"' in options[-1], url
                  assert 'aria-current="page"' in options[-1], url
              for block in re.findall(r'<script\b[^>]*type="application/ld\+json"[^>]*>(.*?)</script>', html, re.I | re.S):
                  json.loads(block)
              print("ET_LIVE_HTTP_200", url, "header-footer=2", flush=True)

          counterparts = {
              "": "et/",
              "best-vps-for-n8n.html": "et/parim-vps-n8n-ile.html",
          }
          for english_rel, estonian_rel in counterparts.items():
              url = base + english_rel
              html = fetch(url)
              menus = menu_re.findall(html)
              assert len(menus) == 2, (url, "English menus")
              for menu in menus:
                  last = re.findall(r'<a\b[^>]*>.*?</a>', menu, re.I | re.S)[-1]
                  assert f'href="{base + estonian_rel}"' in last, url
                  assert last.endswith(">Eesti</a>"), url
              print("ET_RECIPROCAL_HTTP_200", url, flush=True)

          print("ET_PUBLICATION_PASS",len(estonian),"of 11",flush=True)
          PY
