name: Verify Norwegian pages over HTTPS
on:
  push:
    paths:
      - ".github/workflows/verify-norwegian-pages.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check published Norwegian pages
        shell: bash
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          import json, re, time

          BASE="https://agurkin2021-gif.github.io/vps-for-n8n/no/"
          PAGES=["","best-vps-for-n8n.html","about.html","n8n-backup-and-restore.html",
                 "contact.html","install-n8n-on-a-vps.html","n8n-cloud-vs-self-hosted.html",
                 "n8n-vps-requirements.html","privacy.html","secure-n8n-on-a-vps.html",
                 "n8n-queue-mode.html"]

          def check(page):
              url=BASE+page
              result={"url":url,"page":page or "(home)","http_status":None,"ok":False}
              try:
                  req=Request(url,headers={"User-Agent":"n8nVPS-Norwegian-Page-QA/1.0","Accept":"text/html"})
                  with urlopen(req,timeout=17) as r:
                      raw=r.read()
                      html=raw.decode("utf-8",errors="replace")
                      status=r.status
                      final_url=r.url
                      ctype=r.headers.get("Content-Type","")
                  menus=re.findall(r'<div\b[^>]*\bclass=["\'][^"\']*\blang-menu\b[^"\']*["\'][^>]*>',html,re.I)
                  norsk=len(re.findall(r'>Norsk\s*</a>',html,re.I))
                  title=(re.search(r'<title>(.*?)</title>',html,re.I|re.S) or [None,""])[1].strip()
                  lang=bool(re.search(r'<html\b[^>]*\blang=["\'](?:no|nb)["\']',html,re.I))
                  canonical=bool(re.search(r'<link\b(?=[^>]*\brel=["\']canonical["\'])(?=[^>]*\bhref=["\']'+re.escape(url)+r'["\'])[^>]*>',html,re.I))
                  result.update(http_status=status,bytes=len(raw),content_type=ctype,html_lang_no=lang,
                                norwegian_menu_links=norsk,language_menus=len(menus),title=title,
                                canonical_correct=canonical,final_url=final_url)
                  result["ok"]=(status==200 and len(raw)>1000 and "html" in ctype.lower() and lang and norsk>=2
                                and len(menus)==2 and canonical and final_url==url and bool(title))
              except HTTPError as e:
                  result.update(http_status=e.code,error=str(e)[:240])
              except Exception as e:
                  result["error"]=str(e)[:240]
              return result

          history=[]
          for attempt in range(1,11):
              with ThreadPoolExecutor(max_workers=6) as pool:
                  results=list(pool.map(check,PAGES))
              good=sum(r["ok"] for r in results)
              history.append({"attempt":attempt,"successful":good,"checked":len(results)})
              print(f"HTTP audit attempt {attempt}: {good}/{len(results)} passed",flush=True)
              if good==len(PAGES):break
              if attempt<10:time.sleep(9)

          audit={"checked_at_utc":datetime.now(timezone.utc).isoformat(),
                 "method":"GET over HTTPS from GitHub Actions runner",
                 "number_of_pages":len(PAGES),"all_ok":all(r["ok"] for r in results),
                 "attempts":history,"pages":results}
          target=Path(".github/norwegian-pages-http-audit.json")
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(audit,ensure_ascii=False,indent=2),flush=True)

          PY
      - name: Save verifiable HTTP audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/norwegian-pages-http-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record external HTTP verification of 11 Norwegian pages"
            git push origin HEAD:main
          fi
      - name: Require all 11 pages to pass
        shell: bash
        run: |
          python3 -c "import json,sys; a=json.load(open('.github/norwegian-pages-http-audit.json')); sys.exit(0 if a['all_ok'] else 1)"
