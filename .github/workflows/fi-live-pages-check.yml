name: Finnish live URL and browser check
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify published pages and open them with Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from site_config import BASE_URL
          import shutil
          import subprocess
          import sys
          import urllib.request

          base = BASE_URL
          pages = [
              "", "best-vps-for-n8n.html", "about.html",
              "n8n-backup-and-restore.html", "contact.html",
              "install-n8n-on-a-vps.html", "n8n-cloud-vs-self-hosted.html",
              "n8n-vps-requirements.html", "privacy.html",
              "secure-n8n-on-a-vps.html", "n8n-queue-mode.html",
          ]
          errors = []

          def fetch(path):
              url = base + path
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Finnish live QA)"})
                  with urllib.request.urlopen(req, timeout=25) as response:
                      status = response.status
                      body = response.read().decode("utf-8", errors="replace")
                  ok = status == 200 and len(body) > 1000 and "<html" in body.lower()
                  print(f"HTTP {'PASS' if ok else 'FAIL'} {status} {url} bytes={len(body)}", flush=True)
                  if not ok:
                      errors.append(f"Page content or HTTP status invalid: {url}")
                  return body
              except Exception as exc:
                  print(f"HTTP FAIL {url}: {exc}", flush=True)
                  errors.append(f"HTTP request failed: {url}: {exc}")
                  return ""

          for page in pages:
              fetch("fi/" + page)

          for page in ("", "ru/", "de/", "he/"):
              content = fetch(page)
              has_finnish = "Suomi" in content
              print(f"LANGUAGE MENU {'PASS' if has_finnish else 'FAIL'} {base + page} Suomi={has_finnish}", flush=True)
              if not has_finnish:
                  errors.append("Finnish missing from language menu: " + page)

          try:
              req = urllib.request.Request(base + "sitemap.xml", headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=25) as response:
                  sitemap = response.read().decode("utf-8", errors="replace")
              missing = [base + "fi/" + page for page in pages if base + "fi/" + page not in sitemap]
              print(f"SITEMAP {'PASS' if not missing else 'FAIL'} Finnish URLs={len(pages)-len(missing)}/{len(pages)}", flush=True)
              errors.extend("Missing from sitemap: " + path for path in missing)
          except Exception as exc:
              errors.append("Sitemap request failed: " + str(exc))

          chrome = shutil.which("google-chrome") or shutil.which("chromium") or shutil.which("chromium-browser")
          print("CHROME BINARY:", chrome, flush=True)
          if not chrome:
              errors.append("No Chrome/Chromium binary installed on GitHub runner")
          else:
              for path in ("fi/", "fi/n8n-queue-mode.html", "ru/"):
                  url = base + path
                  try:
                      result = subprocess.run(
                          [chrome, "--headless=new", "--no-sandbox", "--disable-gpu",
                           "--disable-dev-shm-usage", "--disable-background-networking",
                           "--virtual-time-budget=3500", "--dump-dom", url],
                          capture_output=True, text=True, timeout=40
                      )
                      dom = result.stdout
                      ok = (result.returncode == 0 and len(dom) > 1000 and
                            "<html" in dom.lower() and "n8n" in dom.lower() and
                            "chrome-error://" not in dom and "Suomi" in dom)
                      print(f"CHROME {'PASS' if ok else 'FAIL'} {url} DOM-bytes={len(dom)} returncode={result.returncode}", flush=True)
                      if not ok:
                          errors.append("Headless Chrome did not render expected page and Finnish menu: " + url + "; stderr=" + result.stderr[-400:])
                  except Exception as exc:
                      print(f"CHROME FAIL {url}: {exc}", flush=True)
                      errors.append("Chrome crashed for " + url + ": " + str(exc))

          if errors:
              print("LIVE QA FAILURE:", flush=True)
              for error in errors:
                  print(" -", error, flush=True)
              sys.exit(1)
          print("LIVE_QA_PASS: 11 Finnish URLs HTTP 200, 4 navigation menus, 11 sitemap entries, 3 Chrome renders", flush=True)
          PY
