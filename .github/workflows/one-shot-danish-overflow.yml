name: One-shot Danish responsive diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-danish-overflow.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check mobile and desktop overflow in Chromium
        run: |
          CHROME_EXE="$(command -v google-chrome || true)"
          npm install --prefix /tmp/danish-playwright --no-audit --no-fund --silent playwright-core
          cat >/tmp/danish-overflow.js <<'JS'
          const fs=require('fs');
          const {chromium}=require('/tmp/danish-playwright/node_modules/playwright-core');
          const root='https://agurkin2021-gif.github.io/vps-for-n8n/';
          const cases=[
           ['da/n8n-backup-and-restore.html','n8n-backup-and-restore.html'],
           ['da/install-n8n-on-a-vps.html','install-n8n-on-a-vps.html'],
           ['da/n8n-queue-mode.html','n8n-queue-mode.html'],
           ['da/secure-n8n-on-a-vps.html','secure-n8n-on-a-vps.html']
          ];
          (async()=>{
          const browser=await chromium.launch({executablePath:process.env.CHROME_EXE,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const report={cases:[],menuTests:[],errors:[]};
          for(const width of [390,1280]){
           const context=await browser.newContext({viewport:{width,height:830}});
           const page=await context.newPage();page.setDefaultTimeout(10000);
           for(const [da,en] of cases){
            for(const path of [da,en]){
             try{
              const resp=await page.goto(root+path,{waitUntil:'domcontentloaded',timeout:24000});
              const diag=await page.evaluate(()=>{
               const W=window.innerWidth, htmlW=document.documentElement.scrollWidth,bodyW=document.body.scrollWidth;
               const off=[];
               for(const el of document.querySelectorAll('body *')){
                 const style=getComputedStyle(el);
                 if(style.display==='none'||style.visibility==='hidden')continue;
                 const r=el.getBoundingClientRect();
                 if((r.right>W+4||r.left< -4)&&r.width>1){
                  let p=el;const nodes=[];for(let k=0;k<4&&p;k++,p=p.parentElement){nodes.unshift(p.tagName.toLowerCase()+(p.id?'#'+p.id:'')+('.'+String(p.className||'').split(/\s+/).slice(0,2).join('.')));}
                  off.push({element:nodes.join(' > '),left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),ownScrollWidth:el.scrollWidth,ownClientWidth:el.clientWidth,cssOverflowX:style.overflowX,whiteSpace:style.whiteSpace,snippet:(el.innerText||'').replace(/\s+/g,' ').slice(0,65)});
                 }
               }
               off.sort((a,b)=>b.right-a.right);
               return {viewport:W,documentScrollWidth:htmlW,bodyScrollWidth:bodyW,overflowPx:htmlW-W,offending:off.slice(0,15),offenders:off.length};
              });
              report.cases.push({path,width,status:resp.status(),...diag});
             }catch(err){report.errors.push({path,width,reason:String(err)})}
            }
           }
           for(const path of ['da/','da/about.html','da/n8n-queue-mode.html']){
            try{
             await page.goto(root+path,{waitUntil:'domcontentloaded',timeout:24000});
             const sw=page.locator('footer .footer-lang-switch');
             await sw.locator('button').click(); const opened=await sw.locator('.lang-menu').isVisible();
             await sw.locator('button').click(); const closed=!(await sw.locator('.lang-menu').isVisible());
             report.menuTests.push({path,width,opened,closed});
            }catch(err){report.errors.push({width,path,reason:String(err)})}
           }
           await context.close();
          }
          await browser.close();
          fs.writeFileSync('.github/danish_overflow_diagnostic.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({errors:report.errors,tests:report.menuTests,overflows:report.cases.filter(x=>x.overflowPx>3).map(x=>({path:x.path,width:x.width,overflowPx:x.overflowPx,top:x.offending.slice(0,6)}))},null,2));
          })();
          JS
          CHROME_EXE="$CHROME_EXE" node /tmp/danish-overflow.js
          rm -f .github/workflows/one-shot-danish-overflow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Diagnose Danish responsive overflow and verify repaired menu' && git push origin HEAD:main
